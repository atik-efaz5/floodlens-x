[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "floodlens"
version = "0.1.0"
description = "Hydrodynamic flood simulation package"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
gis = [
    "rasterio",
    "netCDF4",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
floodlens = "floodlens.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error"]
