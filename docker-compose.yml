# Optional local infrastructure. The API runs without these via the in-memory store.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: floodlens
      POSTGRES_PASSWORD: floodlens
      POSTGRES_DB: floodlens
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/migrations/002_phase2.sql:/docker-entrypoint-initdb.d/02-phase2.sql
      - ./db/migrations/003_phase3.sql:/docker-entrypoint-initdb.d/03-phase3.sql
      - ./db/migrations/004_phase4.sql:/docker-entrypoint-initdb.d/04-phase4.sql
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: floodlens
      MINIO_ROOT_PASSWORD: floodlenssecret
    ports:
      - "9000:9000"
      - "9001:9001"
